name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拿出你的代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 用最新 Flet 1.0 一键打包安卓 APK
        run: |
          echo "flet" > requirements.txt
          pip install "flet[all]"
          yes | flet build apk --yes -v

      - name: 4. 把做好的 APK 放进下载区
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-apk
          path: build/apk/*.apk
